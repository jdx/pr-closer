name: PR Closer
description: Draft pull requests with unresolved automated feedback and close inactive pull requests.
author: jdx

inputs:
  close-after-days:
    description: Number of calendar days without contributor activity before a pull request is closed.
    default: "7"
  ignored-author:
    description: Additional pull request author to ignore. Prefer ignored-authors for multiple authors.
  ignored-authors:
    description: Comma-separated or newline-separated pull request authors to ignore.
    default: |-
      jdx
      mise-en-dev
      dependabot[bot]
      renovate[bot]
  ignored-label:
    description: Additional pull request label to ignore. Prefer ignored-labels for multiple labels.
  ignored-labels:
    description: Comma-separated or newline-separated pull request labels to ignore.
    default: keep-open
  closed-authors:
    description: Comma-separated or newline-separated pull request authors whose pull requests created after closed-after are closed.
    default: Marukome0743
  closed-author:
    description: Additional author whose pull requests created after closed-after are closed. Prefer closed-authors for multiple authors.
  closed-after:
    description: Date (YYYY-MM-DD, UTC). Only pull requests from closed-authors created on a later day are closed.
    default: "2026-10-06"
  closed-reason:
    description: Reason given in the comment on a closed pull request, completing "not being accepted in this repository because <reason>". Optional.
    default: the author is using multiple accounts
  github-token:
    description: GitHub token used to list, comment on, and close pull requests.
  limit:
    description: Maximum number of open pull requests to inspect.
    default: "500"
  dry-run:
    description: Log actions without commenting on or closing pull requests.
    default: "false"

runs:
  using: composite
  steps:
    - name: Draft and close pull requests
      shell: bash
      env:
        CLOSE_AFTER_DAYS: ${{ inputs.close-after-days }}
        CLOSED_AFTER: ${{ inputs.closed-after }}
        CLOSED_AUTHOR: ${{ inputs.closed-author }}
        CLOSED_AUTHORS: ${{ inputs.closed-authors }}
        CLOSED_REASON: ${{ inputs.closed-reason }}
        DRY_RUN: ${{ inputs.dry-run }}
        GH_TOKEN: ${{ inputs.github-token || github.token }}
        IGNORED_AUTHOR: ${{ inputs.ignored-author }}
        IGNORED_AUTHORS: ${{ inputs.ignored-authors }}
        IGNORED_LABEL: ${{ inputs.ignored-label }}
        IGNORED_LABELS: ${{ inputs.ignored-labels }}
        LIMIT: ${{ inputs.limit }}
      run: ${{ github.action_path }}/src/pr-closer.sh
